name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'books/**'
      - 'covers/**'
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Copy library website into the app
        run: ./build_www.sh

      - name: Create Android project
        run: |
          npx cap add android
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} python3 patch_android.py
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../theokairos-library.apk

      - uses: actions/upload-artifact@v4
        with:
          name: theokairos-library-apk
          path: app/theokairos-library.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: បណ្ណាល័យថេអូខៃរ៉ុស — Android 1.0.${{ github.run_number }}
          body: |
            កម្មវិធី Android សម្រាប់អានសៀវភៅក្នុងបណ្ណាល័យ ថេអូខៃរ៉ុស។
            ទាញយក theokairos-library.apk ខាងក្រោម ហើយដំឡើងលើទូរស័ព្ទ Android។
          files: app/theokairos-library.apk
          make_latest: true
